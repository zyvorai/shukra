name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Go tests
        run: go test ./...
      - name: Generate CO-RE objects when clang and BTF exist
        run: make generate
      - name: Web
        run: make web
