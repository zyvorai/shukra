name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 libbpf-dev linux-tools-common linux-tools-generic
          ver="$(uname -r)"
          sudo apt-get install -y "linux-tools-${ver}" || true
          clang_bin="$(command -v clang-18 || true)"
          strip_bin="$(command -v llvm-strip-18 || true)"
          if [ -z "$strip_bin" ] && [ -x /usr/lib/llvm-18/bin/llvm-strip ]; then
            strip_bin=/usr/lib/llvm-18/bin/llvm-strip
          fi
          real="$(find /usr/lib/linux-tools /usr/lib/linux-tools-* -name bpftool \( -type f -o -type l \) 2>/dev/null | head -1)"
          if [ -z "$real" ]; then
            dpkg -L "linux-tools-${ver}" | grep bpftool || true
            real="$(dpkg -L "linux-tools-${ver}" | grep '/bpftool$' | head -1 || true)"
          fi
          echo "clang=$clang_bin strip=$strip_bin bpftool=$real"
          test -n "$clang_bin"
          test -n "$strip_bin"
          test -n "$real"
          sudo ln -sfn "$clang_bin" /usr/local/bin/clang
          sudo ln -sfn "$strip_bin" /usr/local/bin/llvm-strip
          sudo ln -sfn "$real" /usr/local/bin/bpftool
          clang --version
          llvm-strip --version
          bpftool version
      - name: Generate CO-RE objects
        run: |
          make generate
          shopt -s nullglob
          files=(internal/bpfgen/*_bpfel.go)
          test "${#files[@]}" -gt 0
          ls "${files[@]}"
      - name: Go tests
        run: go test -count=1 -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
      - name: Go race
        run: go test -race -count=1 ./...
      - name: Go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
      - name: Fuzz decoders and API JSON
        run: |
          go test -fuzz=FuzzDecodeDNS -fuzztime=5s ./internal/observe
          go test -fuzz=FuzzDecodeTLS -fuzztime=5s ./internal/observe
          go test -fuzz=FuzzDecodeRing -fuzztime=5s ./internal/observe
          go test -fuzz=FuzzDecodeVMM -fuzztime=5s ./internal/observe
          go test -fuzz=FuzzAPIJSON -fuzztime=5s ./internal/api
      - name: Go tests with shukrabpf
        run: make test-bpf
      - name: BPF integration (loads the programs into the kernel)
        # The test binary is built as this user and only that binary runs as root,
        # so root never needs the Go module cache. It checks connect counts, block
        # bytes and the exec filter against load it generates itself.
        run: |
          go test -c -tags shukrabpf -o "$RUNNER_TEMP/observe.test" ./internal/observe
          sudo SHUKRA_BPF_TEST=1 "$RUNNER_TEMP/observe.test" -test.run TestKernelIntegration -test.v
      - name: Tap program egress policy (packet by packet)
        # The tap program runs as a private copy on hand-built packets (BPF_PROG_TEST_RUN): the kernel's own
        # verdict for every rule of the egress policy, with no namespace, veth or VM.
        run: scripts/test-tap-progrun.sh
      - name: Tap program and isolation (network namespace, no KVM)
        # A namespace stands in for the guest and a veth for its tap. Needs Linux 6.6+
        # for TCX, so a red step here on an old runner kernel is a real answer.
        run: scripts/test-tap.sh
      - name: Installer
        run: scripts/test-install.sh
      - name: Console tests
        run: npm --prefix web ci && npm --prefix web test && npm --prefix web audit --audit-level=high
      - name: Console build
        run: npm --prefix web run build

  arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Go tests
        run: go test -count=1 ./...
      - name: Console tests
        run: npm --prefix web ci && npm --prefix web test
