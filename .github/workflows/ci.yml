name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 linux-tools-common linux-tools-generic
          ver="$(uname -r)"
          sudo apt-get install -y "linux-tools-${ver}" || true
          if ! command -v clang >/dev/null 2>&1; then
            sudo ln -sfn "$(command -v clang-18)" /usr/local/bin/clang
          fi
          if ! command -v llvm-strip >/dev/null 2>&1; then
            sudo ln -sfn "$(command -v llvm-strip-18)" /usr/local/bin/llvm-strip
          fi
          real="$(find /usr/lib/linux-tools -type f -name bpftool | head -1)"
          test -n "$real"
          sudo ln -sfn "$real" /usr/local/bin/bpftool
          clang --version
          llvm-strip --version
          bpftool version
      - name: Generate CO-RE objects
        run: |
          make generate
          shopt -s nullglob
          files=(internal/bpfgen/*_bpfel.go)
          test "${#files[@]}" -gt 0
          ls "${files[@]}"
      - name: Go tests
        run: go test -count=1 ./...
      - name: Go tests with shukrabpf
        run: make test-bpf
      - name: Console tests
        run: npm --prefix web ci && npm --prefix web test
      - name: Console build
        run: npm --prefix web run build
