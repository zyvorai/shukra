name: Release

# Pushing a tag such as v0.2.0 builds a tarball and a .deb for each architecture
# and attaches them, with their checksums, to a GitHub release.
#
# The BPF objects are compiled against the kernel BTF of the machine doing the
# build, so each architecture is built on a runner of that architecture. CO-RE then
# lets the same binary run on other kernels of that architecture.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 libbpf-dev linux-tools-common linux-tools-generic
          ver="$(uname -r)"
          sudo apt-get install -y "linux-tools-${ver}" || true
          clang_bin="$(command -v clang-18 || true)"
          strip_bin="$(command -v llvm-strip-18 || true)"
          if [ -z "$strip_bin" ] && [ -x /usr/lib/llvm-18/bin/llvm-strip ]; then
            strip_bin=/usr/lib/llvm-18/bin/llvm-strip
          fi
          real="$(find /usr/lib/linux-tools /usr/lib/linux-tools-* -name bpftool \( -type f -o -type l \) 2>/dev/null | head -1)"
          if [ -z "$real" ]; then
            real="$(dpkg -L "linux-tools-${ver}" | grep '/bpftool$' | head -1 || true)"
          fi
          test -n "$clang_bin" && test -n "$strip_bin" && test -n "$real"
          sudo ln -sfn "$clang_bin" /usr/local/bin/clang
          sudo ln -sfn "$strip_bin" /usr/local/bin/llvm-strip
          sudo ln -sfn "$real" /usr/local/bin/bpftool
      - name: Test
        run: |
          go test -count=1 ./...
          npm --prefix web ci && npm --prefix web test
          scripts/test-install.sh
      - name: Package
        run: scripts/package.sh
        env:
          VERSION: ${{ github.ref_name }}
      - name: Container image
        run: |
          docker build -t "shukra:${VERSION}-${{ matrix.arch }}" .
          docker save "shukra:${VERSION}-${{ matrix.arch }}" | gzip > "dist/shukra-${VERSION}-linux-${{ matrix.arch }}.oci.tar.gz"
          ( cd dist && sha256sum "shukra-${VERSION}-linux-${{ matrix.arch }}.oci.tar.gz" > "shukra-${VERSION}-linux-${{ matrix.arch }}.oci.tar.gz.sha256" )
        env:
          VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shukra-${{ matrix.arch }}
          path: dist/*.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shukra-deb-${{ matrix.arch }}
          path: dist/*.deb*
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: artifacts
          format: cyclonedx-json
          output-file: artifacts/shukra.cdx.json
      - name: Sign
        id: sign
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -z "$COSIGN_KEY" ]; then
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "COSIGN_PRIVATE_KEY is unset; skipping signatures. See docs/development.md."
            exit 0
          fi
          echo "sign=true" >> "$GITHUB_OUTPUT"
      - name: Cosign
        if: steps.sign.outputs.sign == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign artifacts
        if: steps.sign.outputs.sign == 'true'
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          predicate="$(mktemp)"
          printf '%s\n' '{"predicateType":"https://slsa.dev/provenance/v1","subject":"shukra release artifacts","buildType":"https://github.com/zyvorai/shukra/.github/workflows/release.yml"}' > "$predicate"
          shopt -s nullglob
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sig|*.att) continue ;;
            esac
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --output-signature "$f.sig" "$f"
            cosign attest-blob --yes --key env://COSIGN_PRIVATE_KEY --predicate "$predicate" --type slsaprovenance --output-attestation "$f.att" "$f"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
