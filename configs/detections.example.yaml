# Shukra detection rules. `systemctl reload shukra` re-reads this file. A file
# with a mistake is refused and the previous rules stay in force. Unknown keys
# are a mistake, so a misspelled section cannot silently turn a rule off.
#
# Every detection is about the QEMU process, not a process inside the guest.

# How long a repeat of the same detection (same rule, VM and destination) is held
# back. The raw event is still recorded; only the alert is collapsed. Default 5m.
# `suppress: 0s` alerts every time.
# suppress: 5m

# Connect to a watched address. Severity: low, medium, high (default), critical.
destinations:
  - cidr: 185.0.0.0/8
    severity: high
    name: unexpected-egress

# Connect to a watched destination port, whatever the address.
# proto is tcp (the default), udp or any. A rule with no proto has always meant a
# TCP connect, so it still does. Destination rules above apply to every protocol.
# dir is out (the default: the VM connected somewhere), in (a connection made TO the VM,
# matched on the port it reached) or any. A rule with no dir has always meant out.
# ports:
#   - port: 25
#     name: smtp-egress
#     severity: medium
#   - port: 53
#     name: dns-out
#     proto: udp
#   - port: 22
#     name: ssh-into-vm
#     dir: in

# Names a guest looks up over DNS (UDP port 53, seen on its tap). Give exactly one of
# suffix (the name and everything under it), exact, or contains. Names are compared in
# lower case. A DNS name identifies what a VM is doing, so run shukrad with
# -dns-events=false if you do not want names recorded at all.
# dns:
#   - name: crypto-pool
#     suffix: nanopool.org
#     severity: high
#   - name: paste-site
#     contains: pastebin
#     severity: medium

# Learned baselines: what is new for a VM, with no rule to write. Each VM is only observed
# for `learn` from the first time it is seen; after that the first sighting of a network it
# talks to, a site it looks up, or a network that connects in is reported once, as a
# detection (new-destination, new-dns-suffix, new-inbound-peer). Needs -data-dir, or
# learning starts over with every restart. Off unless this section is present.
# baselines:
#   learn: 24h
#   max_alerts_per_day: 20
#   kinds: [destination, dns-suffix, inbound-peer]
#   severity: {dns-suffix: low}

# Process names that may start under a QEMU process without an alert, matched as
# a lowercase prefix. QEMU's own threads are always allowed.
# exec_allow:
#   - node_exporter

# Per-VM metrics over a window (5s to 10m, default 30s). Needs the kernel programs
# attached. A rule stays quiet until a full window of history exists.
#   block_read_p99_ms / block_write_p99_ms   p99 of requests finished in the window
#   wakeup_delay_ms                          mean scheduler wakeup delay
#   kvm_exit_latency_p99_ms                  p99 host time handling a KVM exit (halts excluded)
#   runqueue_delay_p99_ms                    p99 wait for a host CPU after a wakeup
#   block_read_bytes_per_sec, block_write_bytes_per_sec, block_iops
#   kvm_exits_per_sec, tcp_retransmits_per_sec
#   guest_drops_per_sec                      packets/s the kernel dropped on the VM's taps that Shukra did not
#   guest_connect_refused_per_sec, guest_connect_timeouts_per_sec, guest_inbound_per_sec
#                                            the guest's TCP connections that were refused or never answered, and connections made to it
# Latency is read from a log2 histogram, so a p99 can read up to 2x high.
# op is ">" (default) or ">=". severity defaults to medium.
# thresholds:
#   - name: slow-disk
#     metric: block_write_p99_ms
#     value: 50
#     window: 30s
